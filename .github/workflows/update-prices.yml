
name: Check Swedish fuel prices hourly

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook reader
        run: python -m pip install 'openpyxl>=3.1,<4'

      - name: Download official EU workbook if configured
        id: source
        env:
          WORKBOOK_URL: ${{ vars.EU_WEEKLY_WORKBOOK_URL }}
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.parse
          url = os.getenv('WORKBOOK_URL', '').strip()
          if not url:
              print('::notice::EU_WEEKLY_WORKBOOK_URL not configured. No update attempted.')
              with open(os.environ['GITHUB_OUTPUT'],'a') as f:
                  f.write('ready=false\n')
              raise SystemExit(0)
          parsed = urllib.parse.urlparse(url)
          if parsed.scheme != 'https' or not parsed.netloc:
              raise SystemExit('Workbook URL must be HTTPS')
          req = urllib.request.Request(
              url, headers={'User-Agent':'BensinKollen-data-check/1.0'}
          )
          with urllib.request.urlopen(req, timeout=40) as response:
              payload = response.read(5_000_001)
          if len(payload) > 5_000_000 or not payload.startswith(b'PK'):
              raise SystemExit('Not a valid-size XLSX download; refusing update')
          open('weekly.xlsx','wb').write(payload)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('ready=true\n')
          PY

      - name: Import and validate weekly national averages
        if: steps.source.outputs.ready == 'true'
        run: python scripts/update_prices.py weekly.xlsx

      - name: Publish only if data changed
        if: steps.source.outputs.ready == 'true'
        run: |
          if git diff --quiet -- prices.json; then
            echo 'No new data'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prices.json
          git commit -m 'Update validated Swedish national fuel averages'
          git push
